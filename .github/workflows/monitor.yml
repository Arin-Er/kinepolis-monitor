name: Kinepolis Odyssey monitor
run-name: Kinepolis check (${{ inputs.trigger_source || github.event_name }})

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Wie startte deze controle?
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: kinepolis-odyssey-monitor
  cancel-in-progress: false

jobs:
  check-programmation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show trigger
        run: echo "Triggered by ${{ inputs.trigger_source || github.event_name }} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Fetch and process Kinepolis programmation
        env:
          KINEPOLIS_API_URL: https://kinepolisweb-programmation.kinepolis.com/api/Sessions/BE/NL/35300/WWW/Cinema/KinepolisBelgium
          WORKER_URL: https://kinepolis-odyssey-monitor.odyssey-alerts.workers.dev
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
          MONITOR_TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: python scripts/fetch_and_push.py
